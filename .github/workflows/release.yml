name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test
        working-directory: src-tauri
      - run: npx tauri build
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Join-String -Separator "`n" | ForEach-Object { [IO.File]::WriteAllText("$PWD/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt", "$_`n") }
          Get-Content src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object FullName) + "src-tauri/target/release/bundle/nsis/SHA256SUMS.txt"
          $notes = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " | Where-Object { $_ -like "$($env:GITHUB_REF_NAME.TrimStart('v')) *" } | Select-Object -First 1
          $notes = ($notes -split "`n", 2)[1] + "`nThe installer is not code-signed, so Windows SmartScreen will warn. Click More info, then Run anyway. Details in the README."
          Set-Content -Path notes.md -Value $notes
          gh release create $env:GITHUB_REF_NAME $files --title "Tuck $($env:GITHUB_REF_NAME)" --notes-file notes.md
